name: Collect Dota matches
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect OpenDota pro matches
        run: python collector.py
      - name: Produce baseline research report
        run: python analyze.py
      - name: Sample detailed drafts and gold timelines
        run: python collect_details.py
      - uses: actions/upload-artifact@v4
        with:
          name: dota-match-snapshot
          path: output/
          retention-days: 14
